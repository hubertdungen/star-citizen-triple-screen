; Star Citizen Triple Screen external window wrapper
; Edit this file first. The defaults match:
; left 2560x1440 effective, centre 2560x1440 native, right 2560x1440 effective.
;
; This tool is intentionally external. It does not inject a DLL, patch the game,
; read or write game memory, bypass EAC, or launch StarCitizen.exe directly.

[Game]
; LIVE, PTU, EPTU, TECH-PREVIEW, or another StarCitizen channel folder.
Channel=LIVE

; Leave blank for auto-detect common install locations.
; Example: C:\Program Files\Roberts Space Industries\StarCitizen
InstallRoot=

; Leave blank for auto-detect common launcher locations.
; Example: C:\Program Files\Roberts Space Industries\RSI Launcher\RSI Launcher.exe
LauncherPath=

; Safer default: start the RSI Launcher yourself, then run the wrapper.
; Set true if you want this wrapper to open the RSI Launcher for you.
AutoLaunchLauncher=false

; Star Citizen process name without .exe.
ProcessName=StarCitizen

[Layout]
; AutoUnion uses the full Windows virtual desktop rectangle and adapts to the
; number, positions, and effective resolutions of connected displays.
; Manual uses X/Y/Width/Height below and can exclude auxiliary displays.
; PrimaryHeightUnionWidth uses all monitor widths but the primary monitor height.
Mode=AutoUnion

X=-2560
Y=0
Width=7680
Height=1440

; Warn if any detected monitor height differs from target height.
WarnOnHeightMismatch=true

[Display]
; Mixed Windows DPI scaling makes Star Citizen turn 7680x1440 Windowed into
; 8960x1800 on the tested 100% centre + 125% sides layout.
; Keep all three displays at 100% scale for a real 7680x1440 client area.
Require100PercentScale=true

[Window]
; How long to wait for a visible StarCitizen window after starting the wrapper.
WaitSeconds=240

; Remove normal window borders before setting the rectangle.
RemoveBorders=true

; Re-apply while Star Citizen finishes startup. This avoids a tug-of-war loop.
StabilizeSeconds=90
IntervalMilliseconds=1000
TolerancePixels=2
MaxCorrections=30

; Keep watching after startup. Default false to avoid an always-running loop.
ContinuousWatch=false

[Input]
; Star Citizen can keep the Windows cursor clipped to the monitor on which its
; window was created. Expand that normal Windows ClipCursor rectangle to the
; complete target while the wrapper stabilizes the window.
RepairCursorClip=true

[UserCfg]
; Writes or updates USER.cfg in the selected StarCitizen channel folder.
; Existing USER.cfg is backed up before changes.
Enabled=true
Backup=true

; Do not set read-only by default. Star Citizen updates and launcher repairs
; should not be forced to fight a locked config file.
SetReadOnly=false

; Star Citizen custom resolution console variables.
; Use real Windowed mode internally. The wrapper removes the frame externally.
; The August 2026 LIVE build reported WindowMode=2 as Borderless and recreated
; its window/swapchain, which can leave wide mixed-monitor output letterboxed.
ConRestricted=0
WindowMode=0
Width=auto
Height=auto

; Keep false unless testing shows your local build needs explicit fullscreen flags.
SetFullscreenFlags=false
Fullscreen=0
FullscreenWindow=0
BorderlessWindow=0
